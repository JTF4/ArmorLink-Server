<div class="global-controls">
    <h2>Thighs</h2>
    <div
      class="color-button"
      ngx-colors-trigger
      [(ngModel)]="color"
      [style.fill]="color"
      [hideTextInput]="true"
      [hideColorPicker]="true"
      (change)="colorChange(color)"      
    >
    <svg class="pallete-button" xmlns="http://www.w3.org/2000/svg" width="60" viewBox="0 0 24 24"><title>palette</title><path d="M17.5,12A1.5,1.5 0 0,1 16,10.5A1.5,1.5 0 0,1 17.5,9A1.5,1.5 0 0,1 19,10.5A1.5,1.5 0 0,1 17.5,12M14.5,8A1.5,1.5 0 0,1 13,6.5A1.5,1.5 0 0,1 14.5,5A1.5,1.5 0 0,1 16,6.5A1.5,1.5 0 0,1 14.5,8M9.5,8A1.5,1.5 0 0,1 8,6.5A1.5,1.5 0 0,1 9.5,5A1.5,1.5 0 0,1 11,6.5A1.5,1.5 0 0,1 9.5,8M6.5,12A1.5,1.5 0 0,1 5,10.5A1.5,1.5 0 0,1 6.5,9A1.5,1.5 0 0,1 8,10.5A1.5,1.5 0 0,1 6.5,12M12,3A9,9 0 0,0 3,12A9,9 0 0,0 12,21A1.5,1.5 0 0,0 13.5,19.5C13.5,19.11 13.35,18.76 13.11,18.5C12.88,18.23 12.73,17.88 12.73,17.5A1.5,1.5 0 0,1 14.23,16H16A5,5 0 0,0 21,11C21,6.58 16.97,3 12,3Z" /></svg>
    </div>
    
    <div class="brightness-slider">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" viewBox="0 0 24 24"><title>lightbulb</title><path d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z" /></svg>
      <mat-slider min="0" max="100" step="1" discrete [(ngModel)]="brightness" (change)="brightnessChange(brightness)">
        <input matSliderThumb>
      </mat-slider>
    </div>
    
</div>
